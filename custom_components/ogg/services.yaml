hold:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: ogg
    motor:
      required: false
      selector:
        number:
          min: 1
          max: 2
    seconds:
      required: false
      default: 1.0
      selector:
        number:
          min: 0.3
          max: 3
          step: 0.1
          unit_of_measurement: s
